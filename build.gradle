plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"fashion_3790" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// 只在编译和测试使用附属导出的单接口 JAR；不打包、不声明硬运行依赖。
def visualApi = files(providers.gradleProperty('elytraSlotVisualApiJar')
    .getOrElse('run/dependencies/3790s-elytra-slot-visual-api-1.jar'))

dependencies {
    clientCompileOnly visualApi
    testImplementation visualApi
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	testImplementation platform('org.junit:junit-bom:' + project.junit_version)
	testImplementation 'org.junit.jupiter:junit-jupiter'
	// 在普通测试 JVM 中应用 Fabric 的真实补丁，不启动游戏或服务器。
	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
	testImplementation 'org.junit.platform:junit-platform-launcher'
}

processResources {
	def modVersion = project.version
	inputs.property "version", modVersion

	filesMatching("fabric.mod.json") {
		expand "version": modVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.named('test') {
	useJUnitPlatform()
	// 测试日志与临时数据留在构建目录，避免污染项目根目录或用户存档。
	workingDir = layout.buildDirectory.dir('test-work').get().asFile
	doFirst {
		workingDir.mkdirs()
		// 独立测试 JVM 使用同一实际 classpath 复验 SavedData 重读，不启动 Minecraft。
		systemProperty 'fashion3790.testRuntimeClasspath', sourceSets.test.runtimeClasspath.asPath
	}
}

// 精确冻结跨项目接口；不扫描、不构建附属，也不把编译 API 打入产物。
tasks.register('verifyVisualContractApi') {
    inputs.files(visualApi)
    doLast {
        def api = visualApi.singleFile
        if (!api.isFile()) throw new GradleException('缺少 Visual Contract v1 API JAR，请设置 elytraSlotVisualApiJar。')
        def bytes = api.bytes
        def sha = java.security.MessageDigest.getInstance('SHA-256').digest(bytes).encodeHex().toString()
        if (bytes.length != 1410 || sha != 'f1722277bd6301cd22c43c01ddc3ce325917cb19a08bc2d91e8bd02ee2dbe096') {
            throw new GradleException('Visual Contract v1 API JAR 指纹不匹配，禁止使用未知接口。')
        }
    }
}
tasks.named('compileClientJava') { dependsOn 'verifyVisualContractApi' }
tasks.named('compileTestJava') { dependsOn 'verifyVisualContractApi' }

// 独立测试 Mod：生产 JAR 与 sourcesJar 均不消费此源集。
sourceSets {
    armorHarness {
        compileClasspath += sourceSets.main.output + sourceSets.client.output + sourceSets.client.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}
tasks.named('processArmorHarnessResources') {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

tasks.register('armorHarnessJar', Jar) {
    dependsOn tasks.named('armorHarnessClasses')
    archiveBaseName = 'fashion-armor-harness'
    archiveVersion = project.version
    from sourceSets.armorHarness.output
}

// 历史 Spike 源码留存供回归；生产不再携带调试命令或替代外观入口。
sourceSets.client.java.exclude '**/client/dev/spike/**'
sourceSets.test.java.srcDir 'src/client/java/dev/zbw3790/fashion/client/dev/spike'
sourceSets.test.compileClasspath += sourceSets.armorHarness.output.classesDirs
sourceSets.test.runtimeClasspath += sourceSets.armorHarness.output.classesDirs
tasks.named('compileTestJava') { dependsOn 'compileArmorHarnessJava' }
